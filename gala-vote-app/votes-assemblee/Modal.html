<!-- MODAL DE CRITÈRES ET DÉTAILS DU PRIX -->
<div id="criteres-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
    <button onclick="closeCriteresModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">✕</button>
    
    <div class="space-y-2">
      <div class="flex items-center space-x-2 text-indigo-400 text-xs font-bold uppercase tracking-wider">
        <span>ℹ️</span> <span>Détails de la catégorie</span>
      </div>
      <h3 id="criteres-modal-title" class="text-xl font-bold text-white"></h3>
      <p id="criteres-modal-desc" class="text-sm text-slate-300 leading-relaxed bg-slate-900/50 p-3 rounded-xl border border-slate-700/50"></p>
    </div>

    <div class="space-y-3">
      <h4 class="text-sm font-bold text-white flex items-center space-x-2">
        <span>🎯</span><span>Critères de sélection :</span>
      </h4>
      <ul id="criteres-modal-list" class="space-y-2 text-sm text-slate-300"></ul>
    </div>

    <div class="pt-2 flex justify-end">
      <button onclick="closeCriteresModal()" class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl transition">Compris</button>
    </div>
  </div>
</div>

<!-- MODAL DE VOTE PRIX 1 -->
<div id="vote-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">✕</button>
    
    <div class="text-center space-y-2">
      <img id="modal-candidate-img" src="" alt="" class="w-24 h-24 rounded-full mx-auto object-cover border-2 border-indigo-500 bg-slate-900">
      <h3 id="modal-candidate-name" class="text-xl font-bold text-white"></h3>
      <p class="text-xs text-slate-400">Prix N°1 : Meilleur Berger / Bon Respo</p>
    </div>

    <!-- Rappel des critères Prix 1 -->
    <div class="bg-slate-900/60 border border-slate-700/60 p-3 rounded-xl space-y-1.5 text-left">
      <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-400 block">🎯 Critères Prix 1</span>
      <ul id="prix1-modal-criteres" class="text-xs text-slate-300 space-y-1 list-disc list-inside"></ul>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Raison de votre vote (max 200 car.)</label>
      <textarea id="modal-reason" oninput="updateCounter('modal-reason', 'modal-count')" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-white text-sm outline-none resize-none" rows="3" maxlength="200" placeholder="Pourquoi choisissez-vous ce candidat ?"></textarea>
      <div class="text-right text-xs text-slate-400"><span id="modal-count">0</span>/200</div>
    </div>

    <div id="modal-status" class="text-center text-sm font-semibold"></div>

    <div class="flex space-x-3">
      <button onclick="closeModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-sm transition">Annuler</button>
      <button id="modal-submit-btn" onclick="sendVotePrix1()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition">Confirmer</button>
    </div>
  </div>
</div>

<!-- MODAL ACCÈS WHATSAPP / DÉVERROUILLAGE -->
<div id="get-token-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
    <button onclick="closeTokenModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">✕</button>
    
    <div class="text-center space-y-2">
      <div class="text-3xl">🔑</div>
      <h3 id="token-modal-title" class="text-lg font-bold text-white">Déverrouiller la catégorie</h3>
      <p class="text-xs text-slate-400">Saisissez le mot de passe partagé dans le groupe WhatsApp pour accéder au vote.</p>
    </div>

    <div>
      <input type="password" id="group-pass" placeholder="Mot de passe du groupe" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-white text-sm text-center outline-none">
    </div>

    <div id="pass-msg" class="text-center text-sm font-semibold min-h-[20px]"></div>

    <button onclick="submitGroupPassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">Valider</button>
  </div>
</div>
